name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release Artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version
        run: echo "${{ steps.get_version.outputs.VERSION }}" > version.txt

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Generate checksums
        working-directory: jarvis-bootstrap/build/libs
        run: |
          sha256sum jarvis.jar > jarvis.jar.sha256
          sha256sum jarvis-bootstrap-*.jar > jarvis-bootstrap.jar.sha256

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jarvis-bootstrap/build/libs/jarvis.jar
            jarvis-bootstrap/build/libs/jarvis.jar.sha256
            jarvis-bootstrap/build/libs/jarvis-bootstrap-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.VERSION }}

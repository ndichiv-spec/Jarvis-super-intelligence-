[project]
name = "jarvis-enterprise"
version = "0.1.0"
description = "JARVIS Enterprise Platform - Operations, Governance & Collaboration"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_enterprise"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
strict = true

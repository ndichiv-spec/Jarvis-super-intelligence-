[project]
name = "jarvis-api"
version = "0.1.0"
description = "JARVIS package: api"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.0",
  "jarvis-agents",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_api"]

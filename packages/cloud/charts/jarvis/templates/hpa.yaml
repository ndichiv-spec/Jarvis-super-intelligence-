{{- if .Values.scaling -}}
{{- $root := . -}}
{{- range $name, $svc := .Values -}}
{{- if and (kindIs "map" $svc) $svc.enabled (hasKey $svc "image") -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.environment | default "jarvis" }}
  labels:
    app: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $root.Values.scaling.minReplicas | default 2 }}
  maxReplicas: {{ $root.Values.scaling.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.scaling.targetCPUUtilization | default 70 }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.scaling.targetMemoryUtilization | default 80 }}
---
{{- end }}
{{- end }}
{{- end }}

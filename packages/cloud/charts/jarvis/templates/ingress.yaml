{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis
  namespace: {{ .Values.global.environment | default "jarvis" }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.tls | quote }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.domain }}
      secretName: {{ .Values.ingress.tlsSecret | default "jarvis-tls" }}
  {{- end }}
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.api.port | default 8000 }}
          - path: /brain
            pathType: Prefix
            backend:
              service:
                name: brain
                port:
                  number: {{ .Values.brain.port | default 8100 }}
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ai
                port:
                  number: {{ .Values.ai.port | default 8200 }}
          - path: /memory
            pathType: Prefix
            backend:
              service:
                name: memory
                port:
                  number: {{ .Values.memory.port | default 8300 }}
          - path: /knowledge
            pathType: Prefix
            backend:
              service:
                name: knowledge
                port:
                  number: {{ .Values.knowledge.port | default 8400 }}
          - path: /automation
            pathType: Prefix
            backend:
              service:
                name: automation
                port:
                  number: {{ .Values.automation.port | default 8500 }}
          - path: /agents
            pathType: Prefix
            backend:
              service:
                name: agents
                port:
                  number: {{ .Values.agents.port | default 8600 }}
          - path: /orchestration
            pathType: Prefix
            backend:
              service:
                name: orchestration
                port:
                  number: {{ .Values.orchestration.port | default 8700 }}
{{- end }}

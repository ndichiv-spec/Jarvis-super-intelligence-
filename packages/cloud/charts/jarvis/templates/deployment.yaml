{{- $root := . -}}
{{- range $name, $svc := .Values -}}
{{- if and (kindIs "map" $svc) $svc.enabled (hasKey $svc "image") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.environment | default "jarvis" }}
  labels:
    app: {{ $name }}
    {{- include "jarvis.labels" $root | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "jarvis.selectorLabels" $root | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | default 8000 | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $root.Values.global.imageTag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ $svc.port | default 8000 }}
              protocol: TCP
          env:
            - name: JARVIS_ENVIRONMENT
              value: {{ $root.Values.global.environment | quote }}
            - name: JARVIS_SERVICE_NAME
              value: {{ $name | quote }}
            - name: JARVIS_API_URL
              value: "http://api:{{ $root.Values.api.port | default 8000 }}"
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
---
{{- end }}
{{- end }}

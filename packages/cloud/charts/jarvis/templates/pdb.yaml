{{- $root := . -}}
{{- range $name, $svc := .Values -}}
{{- if and (kindIs "map" $svc) $svc.enabled (hasKey $svc "image") ($svc.replicas | default 1 | ge 2) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-pdb
  namespace: {{ $root.Values.global.environment | default "jarvis" }}
spec:
  minAvailable: {{ sub ($svc.replicas | default 1) 1 | max 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
---
{{- end }}
{{- end }}
